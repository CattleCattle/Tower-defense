<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanglier Tower Defense</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>
    <h1>Sanglier Tower Defense</h1>
    <div id="game-container"></div>

    <script type="module">
        import { startPhaserGame } from './src/phaser-loader.js';

        const container = document.getElementById('game-container');

        function clearContainer() {
            // Supprime tous les enfants du conteneur (canvas, etc.)
            while(container.firstChild) {
                container.removeChild(container.firstChild);
            }
        }

        // Lance directement la version Phaser
        clearContainer();
        startPhaserGame(container);
    </script>
</body>
</html>
